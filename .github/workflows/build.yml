name: Compile Pawn Gamemode

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pawn Compiler & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xvf pawnc-3.10.10-linux.tar.gz
          sudo cp -r pawnc-3.10.10-linux/bin/* /usr/local/bin/
          sudo cp -r pawnc-3.10.10-linux/lib/* /usr/local/lib/
          sudo ldconfig

      - name: Download & Install YSI Includes
        run: |
          wget https://github.com/pawn-scripting/YSI-Includes/archive/refs/heads/5.x.zip -O ysi.zip
          unzip ysi.zip
          cp -r YSI-Includes-5.x/* pawno/include/

      - name: Compile Gamemode
        run: |
          mkdir -p gamemodes
          pawncc gamemodes/srp.pwn -i="pawno/include" -o="gamemodes/srp.amx" -Z+ -d3

      - name: Upload Compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: compiled-gamemode
          path: gamemodes/srp.amx
